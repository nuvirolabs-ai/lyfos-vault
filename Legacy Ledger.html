/* ─── Intersection-observer hook ───────────────────────── */
function useInView(delay = 0) {
  const ref  = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setTimeout(() => setVis(true), delay); } },
      { threshold: 0.08 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, [delay]);
  return [ref, vis];
}

function FadeUp({ delay = 0, children, style = {}, className = "" }) {
  const [ref, vis] = useInView(delay);
  return (
    <div ref={ref} className={`fade-up${vis ? " vis" : ""} ${className}`} style={style}>
      {children}
    </div>
  );
}

function Ico({ name, size = 20, color = "currentColor", sw = 1.8 }) {
  const paths = Array.isArray(PATHS[name]) ? PATHS[name] : [PATHS[name]];
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
      {paths.map((d, i) => <path key={i} d={d} />)}
    </svg>
  );
}

/* ─── TRUSTED ACCESS: DIAGRAM ──────────────────────────── */
function TrustDiagram() {
  const [active, setActive] = useState(new Set());

  const cfg      = { total: 6, required: 4, trustedRequired: 3 };
  const mnActive = active.has(0);
  const trustedActive = Array.from(active).filter(i => i > 0).length;
  const opening = mnActive && trustedActive >= 2;
  const unlocked = mnActive && trustedActive >= cfg.trustedRequired;

  const toggle = i => setActive(prev => {
    const n = new Set(prev);
    n.has(i) ? n.delete(i) : n.add(i);
    return n;
  });

  const W = 560, H = 430, cx = 280, cy = 220, R = 140;

  const positions = Array.from({ length: cfg.total }, (_, i) => {
    const a = (i * 2 * Math.PI / cfg.total) - Math.PI / 2;
    return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a };
  });

  const getLabelProps = (a, isPrimary) => {
    const dx = Math.cos(a), dy = Math.sin(a);
    if (isPrimary) return { lx: 0, ly: -72, anchor: "middle", subLy: -58, badgeY: -49 };
    if (dy < -0.5) return { lx: 0, ly: -46, anchor: "middle", subLy: -32 };
    if (dy >  0.5) return { lx: 0, ly:  50, anchor: "middle", subLy: 63  };
    if (dx >  0  ) return { lx: 42, ly: 3,  anchor: "start",  subLy: 16  };
    return               { lx:-42, ly: 3,  anchor: "end",    subLy: 16  };
  };

  const names    = ["Main Nominee", "Key Holder", "Key Holder", "Key Holder", "Key Holder", "Key Holder"];
  const initials = ["MN", "K1", "K2", "K3", "K4", "K5"];
  const needed   = cfg.trustedRequired - trustedActive;
  const statusMsg = unlocked
    ? "3 keys accepted - 14-day owner alert period starts"
    : active.size === 0
      ? "Select Main Nominee + 3 of 5 key holders"
      : !mnActive
        ? "Main Nominee password is required first"
        : opening
          ? "Vault opening sequence visible - 1 more key starts review"
          : `${needed} more key${needed !== 1 ? "s" : ""} needed from trusted holders`;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
      {/* Security model */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 28,
        background: "rgba(255,255,255,.05)", borderRadius: 12, padding: "10px 14px",
        color: "#F7F4EF", fontSize: 13, fontWeight: 700 }}>
        Main Nominee Password
        <span style={{ color: "rgba(247,244,239,.28)", fontWeight: 500 }}>+</span>
        <span style={{ color: "#D99A2B" }}>3 of 5 Keys</span>
        <span style={{ color: "rgba(247,244,239,.28)", fontWeight: 500 }}>+</span>
        14-Day Owner Alert
      </div>

      {/* SVG diagram */}
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}
        style={{ width: "100%", maxWidth: W, overflow: "visible" }}>
        <defs>
          <radialGradient id="rGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stopColor="#2F7D50" stopOpacity=".4" />
            <stop offset="100%" stopColor="#2F7D50" stopOpacity="0"  />
          </radialGradient>
          <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        {/* Connection lines */}
        {positions.map((pos, i) => {
          const on = active.has(i);
          return (
            <line key={i}
              x1={pos.x} y1={pos.y} x2={cx} y2={cy}
              stroke={on ? "#2F7D50" : "rgba(255,255,255,.1)"}
              strokeWidth={on ? 2 : 1}
              strokeDasharray={on ? "none" : "5 6"}
              className={!on ? "dash-anim" : ""}
              style={{ transition: "stroke .35s, stroke-width .35s" }}
            />
          );
        })}

        {/* Glow halo when the vault begins opening */}
        {opening && <circle cx={cx} cy={cy} r={unlocked ? 86 : 72} fill="url(#rGlow)" />}

        {/* Vault ring */}
        <circle cx={cx} cy={cy} r={46}
          fill={unlocked ? "rgba(47,125,80,.2)" : (opening ? "rgba(217,154,43,.14)" : "rgba(12,20,32,.95)")}
          stroke={unlocked ? "#2F7D50" : (opening ? "#D99A2B" : "rgba(255,255,255,.17)")}
          strokeWidth={opening ? 2 : 1.5}
          filter={opening ? "url(#fGlow)" : "none"}
          style={{ transition: "all .5s ease" }}
        />
        <text x={cx} y={cy - 8} textAnchor="middle" fontSize={9} fontWeight={700} letterSpacing=".1em"
          fill={unlocked ? "#7DD3A8" : (opening ? "#D99A2B" : "rgba(255,255,255,.38)")} style={{ transition: "fill .4s" }}>
          {unlocked ? "14-DAY" : (opening ? "OPENING" : "EMERGENCY")}
        </text>
        <text x={cx} y={cy + 5} textAnchor="middle" fontSize={9} fontWeight={700} letterSpacing=".1em"
          fill={unlocked ? "#7DD3A8" : (opening ? "#D99A2B" : "rgba(255,255,255,.38)")} style={{ transition: "fill .4s" }}>
          {unlocked ? "HOLD" : "VAULT"}
        </text>
        {/* Lock/open indicator */}
        <text x={cx} y={cy + 24} textAnchor="middle" fontSize={15}
          fill={unlocked ? "#2F7D50" : (opening ? "#D99A2B" : "rgba(255,255,255,.25)")} style={{ transition: "fill .4s" }}>
          {unlocked ? "◎" : (opening ? "◌" : "◉")}
        </text>

        {/* Threshold badge */}
        <rect x={cx - 24} y={cy - 72} width={48} height={19} rx={9.5}
          fill={trustedActive > 0
            ? (unlocked ? "rgba(47,125,80,.38)" : "rgba(47,102,208,.3)")
            : "rgba(255,255,255,.07)"}
          stroke={trustedActive > 0
            ? (unlocked ? "rgba(47,125,80,.6)" : "rgba(47,102,208,.5)")
            : "rgba(255,255,255,.1)"}
          strokeWidth={1}
          style={{ transition: "all .3s" }}
        />
        <text x={cx} y={cy - 59} textAnchor="middle" fontSize={10} fontWeight={700}
          fill={trustedActive > 0 ? (unlocked ? "#7DD3A8" : "rgba(247,244,239,.75)") : "rgba(247,244,239,.3)"}>
          {trustedActive} / {cfg.trustedRequired}
        </text>

        {/* Person nodes */}
        {positions.map((pos, i) => {
          const on        = active.has(i);
          const isPrimary = i === 0;
          const lp        = getLabelProps(pos.a, isPrimary);
          return (
            <g key={i} onClick={() => toggle(i)} style={{ cursor: "pointer" }}>
              {on && (
                <circle cx={pos.x} cy={pos.y} r={42}
                  fill="rgba(47,125,80,.06)"
                  stroke="rgba(47,125,80,.22)" strokeWidth={1} />
              )}
              <circle cx={pos.x} cy={pos.y} r={30}
                fill={on ? "rgba(47,125,80,.22)" : "rgba(255,255,255,.07)"}
                stroke={on ? "#2F7D50" : (isPrimary ? "#D99A2B" : "rgba(255,255,255,.18)")}
                strokeWidth={on ? 2 : (isPrimary ? 1.5 : 1)}
                style={{ transition: "all .25s ease" }}
              />
              <text x={pos.x} y={pos.y + 5} textAnchor="middle"
                fontSize={11} fontWeight={700}
                fill={on ? "#7DD3A8" : (isPrimary ? "#D99A2B" : "rgba(255,255,255,.5)")}
                style={{ transition: "fill .25s" }}>
                {initials[i]}
              </text>
              {/* Name */}
              <text x={pos.x + lp.lx} y={pos.y + lp.ly} textAnchor={lp.anchor}
                fontSize={10} fontWeight={600}
                fill={on ? "rgba(247,244,239,.85)" : "rgba(247,244,239,.38)"}
                style={{ transition: "fill .25s" }}>
                {names[i]}
              </text>
              {/* MN labels */}
              {isPrimary && (
                <>
                  <text x={pos.x + lp.lx} y={pos.y + lp.subLy} textAnchor={lp.anchor}
                    fontSize={9} fill="#D99A2B" opacity={.65}>
                    password first
                  </text>
                  <rect x={pos.x - 28} y={pos.y + lp.badgeY} width={56} height={15} rx={7.5}
                    fill="rgba(217,154,43,.15)" stroke="rgba(217,154,43,.4)" strokeWidth={1} />
                  <text x={pos.x} y={pos.y + lp.badgeY + 10} textAnchor="middle"
                    fontSize={8} fontWeight={700} fill="#D99A2B" letterSpacing=".08em">
                    REQUIRED
                  </text>
                </>
              )}
            </g>
          );
        })}
      </svg>

      {/* Status line */}
      <p style={{ marginTop: 10, fontSize: 13, fontWeight: 500, minHeight: 20, textAlign: "center",
        color: unlocked ? "#7DD3A8" : "rgba(247,244,239,.38)", transition: "color .35s" }}>
        {unlocked ? "✓  " : ""}{statusMsg}
      </p>
    </div>
  );
}
