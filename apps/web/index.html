<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyfos · Your vault</title>
    <meta name="description" content="Your encrypted Lyfos vault — recoverable by the people you trust, never by us." />
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Google Analytics (GA4) — product app. Vault tokens are stripped from the
         recorded path so recovery/invite/claim secrets never reach analytics. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B6QDMDNL02"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      var p = location.pathname.replace(/\/(invite|claim|download|hold-release|release\/abort)\/.*/, '/$1');
      gtag('config', 'G-B6QDMDNL02', { page_path: p, anonymize_ip: true });
    </script>
  </head>
  <body data-theme="light">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
