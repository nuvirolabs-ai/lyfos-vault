<!--
  NOT the source of og-social-20260810.png.

  This is an older card design ("A vault your family can actually open").
  The card actually served to WhatsApp/LinkedIn/X is the PNG, which reads
  "Yours. Then theirs." and was produced outside this repo.

  Do not rasterise this file over the PNG — it would silently replace the
  live social card with the wrong artwork. If the PNG needs changing,
  re-export it from its original design source. Its type is Inter 600.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#1a9d5a" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#1a9d5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="100%" stop-color="#151518"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0c0c0e"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none"/>

  <!-- brand -->
  <g transform="translate(80,76)">
    <rect width="44" height="44" rx="13" fill="#1a9d5a"/>
    <g transform="translate(13,12)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="8" width="13" height="9" rx="2"/>
      <path d="M5.5 8 V5.5 a3.5 3.5 0 0 1 7 0 V8"/>
    </g>
    <text x="60" y="31" font-size="30" font-weight="600" fill="#f4f4f5" letter-spacing="-0.5">Lyfos</text>
  </g>

  <!-- big lock mark -->
  <g transform="translate(80,196)">
    <rect width="104" height="104" rx="30" fill="url(#card)" stroke="rgba(255,255,255,0.10)"/>
    <g transform="translate(31,28)" fill="none" stroke="#46d98a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="20" width="36" height="27" rx="6"/>
      <path d="M10 20 V13 a11 11 0 0 1 22 0 v7"/>
      <circle cx="21" cy="33" r="3" fill="#46d98a" stroke="none"/>
    </g>
  </g>

  <!-- headline -->
  <text x="80" y="380" font-size="68" font-weight="700" fill="#f7f7f8" letter-spacing="-2">A vault your family</text>
  <text x="80" y="456" font-size="68" font-weight="700" letter-spacing="-2"><tspan fill="#f7f7f8">can </tspan><tspan fill="#46d98a">actually open.</tspan></text>

  <!-- sub -->
  <text x="82" y="516" font-size="28" font-weight="400" fill="#a9a9b2">Zero-knowledge vault, built for life recovery.</text>

  <!-- footer chips -->
  <g transform="translate(80,560)" fill="#76767e" font-size="20" font-weight="500">
    <circle cx="6" cy="-6" r="5" fill="#1a9d5a"/>
    <text x="22" y="0">Five trusted people · three to release · a 14-day hold</text>
  </g>

  <text x="1120" y="580" text-anchor="end" font-size="20" fill="#50505a">lyfos.in</text>
</svg>
